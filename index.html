<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f7ff" />
  <meta name="description" content="独立的 GitHub Pages 国内网络连通性测试页，无外部依赖。" />
  <title>网络连通性测试 · GitHub Pages</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #1c2942; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; padding: 24px; display: grid; place-items: center; background: radial-gradient(ellipse at 5% 15%, #d9e8ff 0, transparent 42%),radial-gradient(ellipse at 90% 90%, #e7dcff 0, transparent 38%),#f5f7fb; }
    main { width: min(100%, 570px); padding: clamp(28px, 7vw, 48px); background: #ffffffed; border: 1px solid #e9edf5; border-radius: 24px; box-shadow: 0 22px 70px #26406a12; }
    .tag { display: inline-flex; gap: 10px; align-items: center; color: #547195; font-weight: 750; font-size: 12px; letter-spacing: .09em; }
    .tag:before { content:""; width: 9px; height: 9px; background: #28b47a; border-radius: 50%; box-shadow: 0 0 0 4px #dcf7e8; }
    h1 { font-size: clamp(30px, 7vw, 44px); line-height: 1.22; margin: 30px 0 17px; letter-spacing:-.035em; }
    .intro { color: #66778c; font-size: 15px; line-height: 1.95; margin: 0 0 28px; }
    .status { display: flex; gap: 14px; padding: 19px; border: 1px solid #d8f0e1; background: #f1faf5; border-radius: 15px; }
    .icon { flex: none; width: 30px; height: 30px; background: #199963; color: #fff; display: grid; place-items: center; border-radius: 50%; font-weight: 800; }
    .status strong { display:block; font-size:16px; color:#146c46; margin: 3px 0 6px; }
    .status span { display: block; color: #55806c; font-size: 13px; line-height: 1.6; }
    .info { margin: 29px 0 0; padding-top: 18px; border-top: 1px solid #eef1f6; }
    .info div { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap: 5px 16px; margin: 14px 0; }
    dt { color:#97a4b5; font-size:13px; } dd { margin:0; font-size:13px; color:#53667e; text-align:right; overflow-wrap:anywhere; }
    button { border:0; appearance:none; background:#2967d7; color:white; font:inherit; font-weight:650; padding:15px; width:100%; border-radius:12px; cursor:pointer; margin-top:20px; }
    button:hover {background:#2059c0;} button:focus-visible{outline:3px solid #adc7ff;outline-offset:3px;}
    footer {text-align:center;font-size:12px;line-height:1.85;color:#9ba6b5;margin-top:23px;}
  </style>
</head>
<body>
  <main>
    <div class="tag">GITHUB PAGES · CHINA ACCESS TEST</div>
    <h1>你好，网络世界 👋</h1>
    <p class="intro">这是一个运行在<strong>独立 GitHub 仓库</strong>中的纯静态网页。如果你能看到这里，说明当前网络至少可以正常加载这个 GitHub Pages 页面。</p>
    <div class="status" aria-live="polite">
      <div class="icon" aria-hidden="true">✓</div>
      <div><strong>页面加载成功</strong><span>HTML 与样式已成功载入。本页不依赖 Google Fonts、外部 JavaScript 或 CDN。</span></div>
    </div>
    <dl class="info">
      <div><dt>当前域名</dt><dd id="host">载入中…</dd></div>
      <div><dt>本地时间</dt><dd id="now">载入中…</dd></div>
      <div><dt>页面加载耗时</dt><dd id="load">检测中…</dd></div>
      <div><dt>测试版本</dt><dd>2026-11-03 · v1.0</dd></div>
    </dl>
    <button type="button" id="copy">复制网站地址</button>
    <footer>中国大陆网络测试建议：关闭 VPN / 代理，再分别使用手机流量、家庭宽带和校园网打开。<br>不采集 IP，不上传设备或浏览器信息。</footer>
  </main>
  <script>
    document.getElementById("host").textContent = location.hostname;
    document.getElementById("now").textContent = new Date().toLocaleString("zh-CN", { hour12: false });
    window.addEventListener("load", function () {
      const nav = performance.getEntriesByType("navigation")[0];
      document.getElementById("load").textContent = nav ? Math.round(nav.duration) + " ms（浏览器测量）" : "页面已完成加载";
    });
    document.getElementById("copy").addEventListener("click", async function () {
      try {
        await navigator.clipboard.writeText(location.href);
        this.textContent = "已复制 ✓";
      } catch (_) { this.textContent = "请从地址栏复制网址"; }
    });
  </script>
</body>
</html>
